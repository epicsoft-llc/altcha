stages:
  - test
  - build
  - release

variables:
  DOCKER_REGISTRY: "epicsoft/altcha"
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

test:
  stage: test
  image: node:24-alpine
  script:
    - npm ci --no-audit --no-fund
    - npm test

#### The tokens go in over stdin: '-p' would put them in the process list of the runner,
#### where every other process on that machine can read them.
.docker:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker buildx use epicbuilder > /dev/null 2>&1 || docker buildx create --name epicbuilder --use > /dev/null 2>&1
  after_script:
    - docker logout $CI_REGISTRY
    - docker logout

develop:
  extends: .docker
  stage: build
  variables:
    VERSION: "develop"
  script:
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

latest:
  extends: .docker
  stage: build
  variables:
    VERSION: "latest"
  script:
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        -t ${DOCKER_REGISTRY}:${VERSION}
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

#### Versioned release from a git tag 'X.Y.Z' - the only tag a deployment should pin.
#### The tag has to match the version in package.json, which the admin UI shows: two
#### numbers for one build would be worse than none.
release:
  extends: .docker
  stage: build
  variables:
    VERSION: "${CI_COMMIT_TAG}"
  script:
    #### a block scalar: as a plain list item the ': ' inside the sed expression would make YAML read a key
    - |
      PACKAGE_VERSION=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
      if [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
        echo "Tag ${VERSION} does not match version ${PACKAGE_VERSION} in package.json"
        exit 1
      fi
    - MAJOR_MINOR="${VERSION%.*}"
    - MAJOR="${MAJOR_MINOR%.*}"
    - docker buildx build . --push --pull --no-cache
        --platform $BUILD_PLATFORMS
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        -t ${CI_REGISTRY_IMAGE}:${MAJOR_MINOR}
        -t ${CI_REGISTRY_IMAGE}:${MAJOR}
        -t ${CI_REGISTRY_IMAGE}:latest
        -t ${DOCKER_REGISTRY}:${VERSION}
        -t ${DOCKER_REGISTRY}:${MAJOR_MINOR}
        -t ${DOCKER_REGISTRY}:${MAJOR}
        -t ${DOCKER_REGISTRY}:latest
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  retry: 1
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

uploadReadme:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  script:
    #### Docker Hub takes at most 25,000 characters - counted in bytes here, which is stricter
    - |
      size=$(wc -c < README.md)
      if [ "$size" -gt 25000 ]; then
        echo "README.md has $size bytes, Docker Hub takes 25000 - shorten it or move a section to examples/"
        exit 1
      fi
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Self-hosted ALTCHA challenge, verification and form mail service with an admin web UI"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

#### The code reaches GitHub through the GitLab push mirror, so this job waits for the tag there.
#### GITHUB_TOKEN: fine-grained token with Contents read and write, a protected variable - the tag must be protected too.
github-release:
  stage: release
  image: epicsoft/ci:latest
  needs:
    - job: release
  variables:
    GITHUB_REPO: "epicsoft-llc/${CI_PROJECT_NAME}"
  script:
    - |
      api="https://api.github.com/repos/${GITHUB_REPO}"
      auth="Authorization: Bearer ${GITHUB_TOKEN}"
      notes=$(awk -v head="## [${CI_COMMIT_TAG}]" 'index($0, head) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md)
      if [ -z "$notes" ]; then
        echo "CHANGELOG.md has no entry for ${CI_COMMIT_TAG}"
        exit 1
      fi
      if curl -sf -H "$auth" "$api/releases/tags/${CI_COMMIT_TAG}" > /dev/null; then
        echo "Release ${CI_COMMIT_TAG} already exists on GitHub"
        exit 0
      fi
      tries=0
      until curl -sf -H "$auth" "$api/git/ref/tags/${CI_COMMIT_TAG}" > /dev/null; do
        tries=$((tries + 1))
        if [ "$tries" -ge 60 ]; then
          echo "Tag ${CI_COMMIT_TAG} did not reach GitHub within 10 minutes - check the push mirror"
          exit 1
        fi
        sleep 10
      done
      jq -n --arg tag "${CI_COMMIT_TAG}" --arg body "$notes" '{tag_name: $tag, name: $tag, body: $body}' \
        | curl -sS --fail-with-body -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d @- > /dev/null
      echo "Release ${CI_COMMIT_TAG} created on GitHub"
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
